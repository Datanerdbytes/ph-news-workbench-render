name: CI

# Verification gate for every pull request: types, lint, unit tests, a
# production Docker build and a container vulnerability scan on both; the
# Playwright suite against that container, where the protected `e2e`
# environment holds its secrets. The app builds env-free (no DB or secrets are
# touched at build time — routes are force-dynamic and queries only run per
# request), so the build job needs no environment setup. The real deploy build
# happens in Render's Docker build; this catches breakage before it gets there.
#
# The same workflow runs on main through `deploy.yml`, which calls it as a
# reusable workflow and deploys to Render only after this workflow is green.
#
# Job layout: static analysis and the unit suite run in parallel because both
# are cheap; the Docker build waits for both so a broken PR never burns build
# minutes; the e2e gate waits for the trusted workflow's Playwright result.
on:
  pull_request:
  workflow_call:
    inputs:
      sha:
        description: "Commit sha to check out (defaults to the commit that triggered the run)"
        required: false
        type: string
  workflow_dispatch: {}

# Superseded runs on the same branch or PR are pointless — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit this run verifies: the triggering commit by default,
          # the resolved commit when deploy.yml calls this workflow.
          ref: ${{ inputs.sha || github.sha }}
          # `npm ci` runs the pull request's own lifecycle scripts, so the
          # checkout must not leave its token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Match the runtime image (Dockerfile → node:22-slim).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # prepare runs husky's git-hooks installer — meaningless in CI and
          # the Dockerfile skips it the same way.
          HUSKY: '0'

      # Next 16 dropped `next lint` — the ESLint CLI is the supported path.
      - name: Lint
        run: npx eslint .

      # typegen writes the App Router route types that tsc then checks.
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint hadolint - < Dockerfile

      # Blocking floor: nothing above critical is tolerated.
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      # Advisory for now. All four high advisories are one transitive chain —
      # @vercel/blob → @vercel/oidc → @vercel/cli-config → zod<4.6.6 — where
      # the zod schemas parse the developer's local Vercel CLI config, not
      # request input, and npm's only offered fix is a breaking downgrade of
      # @vercel/blob. Promote this to blocking once the chain is patched
      # upstream; deleting the step is the wrong way to make it green.
      - name: Dependency audit (high — advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit this run verifies: the triggering commit by default,
          # the resolved commit when deploy.yml calls this workflow.
          ref: ${{ inputs.sha || github.sha }}
          # `npm ci` runs the pull request's own lifecycle scripts, so the
          # checkout must not leave its token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      # Vitest picks the environment per file: node for the media/route suites
      # that touch node:fs and node:stream, jsdom for the React components.
      # The exclude list keeps the .next/standalone build copy out of the glob.
      - name: Unit and integration tests
        run: npx vitest run

      # The retry math is written in local time; this TZ swings two hours
      # across its DST shift (UTC+0 <-> UTC+2), so a floor or window computed
      # in wall-clock terms fails here before it fails for a real user.
      - name: Schedule retry across two-hour DST fallback
        run: TZ=Antarctica/Troll npx vitest run app/videos/page.test.tsx

  docker:
    name: Docker build & scan
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The image is tagged with the commit it was built from, so the e2e job
      # pulls exactly what this job pushed.
      IMAGE_SHA: ${{ inputs.sha || github.sha }}
    permissions:
      contents: read
      # The e2e job pulls the image this job pushes.
      packages: write
      # Trivy findings land in the code-scanning tab.
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit this run verifies: the triggering commit by default,
          # the resolved commit when deploy.yml calls this workflow.
          ref: ${{ inputs.sha || github.sha }}
          # The build context is the pull request's own tree and the
          # Dockerfile in it is the pull request's own code. Keeping the
          # token in .git/config would put it inside that context — a pull
          # request can drop the `.git` line from .dockerignore and read it
          # in a build step.
          persist-credentials: false

      # A registry reference must be lowercase, and the owner of this repo is
      # not. The path GitHub serves the packages under is the lowercased one.
      - name: Resolve the image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/app" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork runs with a read-only GITHUB_TOKEN, so it
      # cannot push to GHCR — an unconditional push turned the required Docker
      # check red for every outside contributor. Fork runs build the same
      # image into the runner's daemon and scan it from there; same-repo pull
      # requests and pushes publish it as before.
      - name: Resolve the publish target
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.trusted == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the production image
        if: steps.publish.outputs.trusted == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_SHA }}
          # Layer cache shared with every other job and run on this branch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_STORAGE_DRIVER=${{ vars.NEXT_PUBLIC_STORAGE_DRIVER || 'blob' }}
            NEXT_PUBLIC_BLOB_ROOT=${{ vars.NEXT_PUBLIC_BLOB_ROOT || '' }}

      - name: Build the image locally
        if: steps.publish.outputs.trusted != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # Loaded into the runner's Docker daemon instead of a registry — the
          # scan below then checks the same image the suite would have run.
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_SHA }}
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_STORAGE_DRIVER=${{ vars.NEXT_PUBLIC_STORAGE_DRIVER || 'blob' }}
            NEXT_PUBLIC_BLOB_ROOT=${{ vars.NEXT_PUBLIC_BLOB_ROOT || '' }}

      - name: Pull the image for scanning
        if: steps.publish.outputs.trusted == 'true'
        run: docker pull ${{ env.IMAGE }}:${{ env.IMAGE_SHA }}

      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_SHA }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Unfixed base-image CVEs have no upstream patch to pull in — they
          # would make the gate permanently red without anything to do.
          ignore-unfixed: true
          exit-code: '1'
          # node:22-slim ships npm with its own CLI dependencies (pacote,
          # sigstore, brace-expansion, ip-address, picomatch). Ten HIGH
          # advisories live in that tree and none of it is the app — excluding
          # it leaves the gate scanning what actually ships.
          skip-dirs: "/usr/local/lib/node_modules/npm"

      # DIAGNOSTIC, NOT A GATE: probes whether the runtime permits the
      # namespace sandbox the verified isolation runner needs. GitHub-hosted
      # Ubuntu runners (and Render-like runtimes) refuse unprivileged user
      # namespaces, so this is expected to fail here — the media paths fail
      # closed at runtime regardless, and OBS publishing remains the manual
      # path. Kept as a step so the empirical answer is visible per image.
      - name: Probe sandbox feasibility in the image (informational)
        continue-on-error: true
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ env.IMAGE_SHA }} \
            sh -c 'bwrap --version && bwrap --unshare-all --ro-bind / / echo sandbox-ok || echo "SANDBOX UNAVAILABLE on this runtime" '

      - name: Upload the scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  e2e:
    name: E2E against the production container
    needs: docker
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Verify the trusted E2E result for this merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_TITLE: E2E PR ${{ github.event.number }} ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }}
          EXPECTED_JOB: Playwright (${{ github.sha }})
        run: |
          # Only accept Actions metadata from this exact workflow and event.
          # In particular, a missing, cancelled or skipped suite is not a pass.
          for attempt in $(seq 1 345); do
            if runs=$(gh api --method GET "repos/$REPO/actions/workflows/trusted-e2e.yml/runs" -f event=pull_request_target -F per_page=100); then
              run=$(jq -c --arg title "$RUN_TITLE" '[.workflow_runs[] | select(.display_title == $title)] | first // {}' <<< "$runs")
              if [[ $(jq -r .status <<< "$run") == completed ]]; then
                id=$(jq -r .id <<< "$run")
                jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs")
                if [[ $(jq -r .conclusion <<< "$run") == success ]] &&
                   jq -e --arg name "$EXPECTED_JOB" '.jobs | any(.name == $name and .conclusion == "success")' <<< "$jobs" >/dev/null; then
                  exit 0
                fi
                echo "::error::Trusted E2E run $id did not pass for this merge commit."
                exit 1
              fi
            fi
            sleep 20
          done
          echo "::error::No completed trusted E2E run for this revision; see docs/deployment.md."
          exit 1
