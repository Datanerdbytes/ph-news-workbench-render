# Fly.io config for the media runner worker (deploy with:
#   fly deploy -c fly.worker.toml -a ph-news-media-runner
# ). The web app stays on Render — this is only the sandboxed native-media
# service the web app proxies to (see lib/live/runner-config.ts).
app = 'ph-news-media-runner'
primary_region = 'sin1'

[build]
  dockerfile = 'Dockerfile.worker'

[env]
  PORT = '8080'
  # The pump's runtime gate (lib/reels/media.ts) — the worker IS the local
  # runtime for the pipeline; secrets (DATABASE_URL, BETTER_AUTH_SECRET,
  # MEDIA_RUNNER_TOKEN) ride in via `fly secrets`, never this file.
  ENABLE_LOCAL_VIDEO_PROCESSING = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

  # The sandbox state is part of health: mediaSandboxAvailability reports
  # 'ready' only when the bwrap namespace probe passed at boot.
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[vm]
  size = 'shared-cpu-1x'
  memory = '1gb'
