# Shared CodeRabbit review configuration — applies to every PR on this repo.
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
language: en-US
reviews:
  auto_review:
    # Reviews keep firing on every push — the default pauses them after 5
    # reviewed commits, which would silently stop later PRs from being
    # reviewed.
    auto_pause_after_reviewed_commits: 0
    # Draft PRs get reviewed too (default excludes them).
    drafts: true
  # "chill" keeps the review focused on meaningful issues instead of nitpicks.
  profile: chill
  # Automatic Approvals: CodeRabbit requests changes while it has actionable
  # findings and approves once they are addressed. Its approval is what
  # satisfies the "1 approval" rule in the branch protection, so a finding
  # that nobody fixes keeps the pull request unmergeable. The legacy
  # `request_changes_workflow` key is the same switch under its old name and
  # must not be set next to this one.
  auto_approvals:
    enabled: true
    # A review that is skipped on purpose — a draft, or a pull request with
    # nothing reviewable in it — still gets an approval, so a dependency bump
    # cannot sit in the queue forever waiting for a review that will never
    # happen. Errors and cancelled reviews are excluded from this.
    approve_on_skipped_review: true
    # The author approval command stays available (it is the default): it is
    # the recorded way out of a CodeRabbit false positive or a rate-limited
    # review. It does not clear the three directory checks — those are GitHub
    # check runs that the branch protection requires, and nothing but a fix
    # or a new review clears them.
    allow_author_approval: true
  # A review that errors out fails the CodeRabbit check instead of passing it,
  # so a broken review cannot be merged past. Retry with
  # `@coderabbitai full review`.
  fail_commit_status: true
  high_level_summary: true
  review_status: true
  poem: false
  # Skip generated dependency churn.
  path_filters:
    - "!**/package-lock.json"
    - "!**/.next/**"
    - "!**/tsconfig.tsbuildinfo"
  path_instructions:
    - path: "app/api/**"
      instructions: >-
        Route handlers must be force-dynamic and must not touch the database
        at import time. Check auth with the requirePlatformConnection /
        requireWorkspace helpers before any data access, and never log or
        return raw access tokens.
    - path: "lib/**"
      instructions: >-
        Pure helpers in lib/ are unit-tested with vitest in sibling *.test.ts
        files — flag behavior changes that ship without a matching test
        update. Secrets are encrypted via lib/facebook-token, never stored
        in plaintext.
    - path: "components/**"
      instructions: >-
        Follow the Ink & White theme and existing component patterns. Brand
        marks must use components/platform-mark.tsx (this lucide version has
        no brand icons). cn() silently drops unknown text-* class names.
    - path: ".github/workflows/**"
      instructions: >-
        Workflow changes are security-sensitive: flag anything that executes
        PR-controlled input, widens `permissions:` beyond least privilege, or
        can leak secrets (CRON_SECRET, KEEP_ALIVE_URL) into logs or curl
        output.
chat:
  auto_reply: true
